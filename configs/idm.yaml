group: "idm-lerobot"
seed: 0

dataset:
  repo_id: "HuggingFaceVLA/libero"
  image_key: "observation.images.image"
  target_img_size: 64

idm:
  total_updates: 10000
  batch_size: 512
  use_aug: False
  future_obs_offset: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_epochs: 3
  act_head_dim: 1024
  act_head_dropout: 0.0
  encoder_scale: 12
  encoder_num_res_blocks: 2
  encoder_deep: False
  encoder_dropout: 0.0
  frame_stack: 3

bc:
  num_epochs: 10
  batch_size: 512
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_epochs: 0
  encoder_scale: 32
  encoder_num_res_blocks: 2
  encoder_deep: False
  dropout: 0.0
  use_aug: False
  frame_stack: 3
