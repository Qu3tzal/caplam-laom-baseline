group: "lapo-lerobot"
seed: 0

dataset:
  repo_id: "HuggingFaceVLA/libero"
  image_key: "observation.images.image"
  target_img_size: 64

lapo:
  num_epochs: 10
  batch_size: 512
  future_obs_offset: 10
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_epochs: 3
  latent_action_dim: 8192
  encoder_scale: 6
  encoder_num_res_blocks: 2
  encoder_deep: False
  frame_stack: 3

bc:
  num_epochs: 10
  batch_size: 512
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_epochs: 0
  encoder_scale: 32
  encoder_num_res_blocks: 2
  encoder_deep: False
  dropout: 0.0
  use_aug: False
  frame_stack: 3

decoder:
  total_updates: 2500
  batch_size: 512
  learning_rate: 0.0003
  weight_decay: 0.0
  warmup_epochs: 0
  hidden_dim: 256
  use_aug: False
